<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Timestamp Converter - Toasty Utilities</title>

  <meta
    name="description"
    content="Convert Unix timestamps into readable dates and times easily with Toasty Utilities."
  >

  <link rel="stylesheet" href="../style.css">
</head>

<body>
  
  <header>
    <h1>Toasty Utilities</h1>

    <nav>
      <a href="../">Home</a>
    </nav>
  </header>

  <main>

    <section>
      <h2>Timestamp Converter</h2>

      <p>Convert Unix timestamps into readable dates and times.</p>
    </section>

    <section>
      <h2>Unix Timestamp</h2>

      <div class="converter">

        <div class="converter-input">
          <label for="timestamp">Timestamp</label>
          <input type="number" id="timestamp" placeholder="Enter a Unix timestamp">
        </div>

        <div class="converter-result">
          <p>Result:</p>
          <output class="result" id="timestamp-utc">--</output>
          <output class="result" id="timestamp-local">--</output>
        </div>

      </div>
    </section>

    <section>
      <h2>Date and Time</h2>

      <div class="converter">

        <div class="converter-input">
          <label for="date-time">Date and Time (System local time)</label>
          <input type="datetime-local" id="date-time">
        </div>

        <div class="converter-result">
          <p>Unix Timestamp:</p>
          <output class="result" id="date-result">--</output>
        </div>

      </div>
    </section>

  </main>

  <footer>
    <p>&copy; 2026 Toasty Utilities</p>
  </footer>

  <script src="script.js"></script>

</body>
</html>
