<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Lorem Ipsum Generator - Toasty Utilities</title>

  <meta
    name="description"
    content="Generate placeholder text for your projects easily with Toasty Utilities."
  >

  <link rel="stylesheet" href="../style.css">
</head>

<body>
  
  <header>
    <h1>Toasty Utilities</h1>

    <nav>
      <a href="../">Home</a>
    </nav>
  </header>

  <main>

    <section>
      <h2>Lorem Ipsum Generator</h2>

      <p>Generate placeholder text for your projects.</p>
    </section>

    <section>

      <div class="converter">

        <div class="converter-input">
          <label for="paragraph-count">Number of Paragraphs</label>
          <input type="number" id="paragraph-count" min="1" max="10" value="3">
        </div>

        <button id="generate-button">Generate</button>

        <div class="converter-result">
          <p>Result:</p>
          <div id="generator-result"></div>
        </div>

      </div>
    </section>

  </main>

  <footer>
    <p>&copy; 2026 Toasty Utilities</p>
  </footer>

  <script src="script.js"></script>

</body>
</html>
